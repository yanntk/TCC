spring.application.name=tcc-streaming-app
server.port=8080

# Virtual threads (Spring Boot 3.2+)
spring.threads.virtual.enabled=true

# PostgreSQL — ajuste usuário/senha/nome do banco
spring.datasource.url=jdbc:postgresql://localhost:5432/tcc_streaming
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool pequeno de propósito (o doc cita 30)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
